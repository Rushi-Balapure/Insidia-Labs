[project]
name = "insidia-engine"
version = "0.1.0"
description = "Insidia cloud brain: API, workers, and encryption."
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16",
  "celery>=5.5",
  "cryptography>=45",
  "fastapi>=0.116",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0.41",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.17",
  "pytest>=8.4",
  "pyyaml>=6.0",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "workers"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["api", "workers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["api", "workers"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
