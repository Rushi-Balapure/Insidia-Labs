[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://insidia:insidia_dev_only@localhost:5432/insidia

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
