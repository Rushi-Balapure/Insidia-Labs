name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv python install 3.12
      - name: Build the wheel and checksums
        working-directory: core
        run: |
          cp ../NOTICE ../THIRD_PARTY_NOTICES.md packaging/
          uv build --wheel
          (cd dist && sha256sum ./*.whl > SHA256SUMS)
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the wheel
        working-directory: core
        run: |
          wheel=$(echo dist/*.whl)
          cosign sign-blob --yes --bundle "${wheel}.bundle" "$wheel"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "Insidia $TAG" \
            --notes-file site/src/content/launch.md \
            core/dist/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/rushi-balapure/insidia:${{ github.ref_name }}
            ghcr.io/rushi-balapure/insidia:latest
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/rushi-balapure/insidia@${{ steps.build.outputs.digest }}"
