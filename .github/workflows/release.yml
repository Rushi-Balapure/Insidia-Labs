name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.12
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("core/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v${version}" ]; then
            echo "error: tag $TAG does not match core/pyproject.toml version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Extract the release notes
        run: |
          awk -v want="## ${VERSION}" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "error: CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
      - name: Build the wheel and checksums
        working-directory: core
        run: |
          cp ../NOTICE ../THIRD_PARTY_NOTICES.md packaging/
          uv build --wheel
          (cd dist && sha256sum ./*.whl > SHA256SUMS)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the wheel
        working-directory: core
        run: |
          wheel=$(echo dist/*.whl)
          cosign sign-blob --yes --bundle "${wheel}.bundle" "$wheel"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --latest \
            --title "Insidia $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            core/dist/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/rushi-balapure/insidia:${{ github.ref_name }}
            ghcr.io/rushi-balapure/insidia:latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/rushi-balapure/insidia@${{ steps.build.outputs.digest }}"
