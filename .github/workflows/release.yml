name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - name: Build the wheel and checksums
        working-directory: core
        run: |
          cp ../NOTICE ../THIRD_PARTY_NOTICES.md packaging/
          uv build --wheel
          (cd dist && sha256sum ./*.whl > SHA256SUMS)
      - uses: sigstore/cosign-installer@v3
      - name: Sign the wheel
        working-directory: core
        run: |
          wheel=$(echo dist/*.whl)
          cosign sign-blob --yes --bundle "${wheel}.bundle" "$wheel"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Insidia ${{ github.ref_name }}" \
            --notes-file site/src/content/launch.md \
            core/dist/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/rushi-balapure/insidia:${{ github.ref_name }}
            ghcr.io/rushi-balapure/insidia:latest
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/rushi-balapure/insidia@${{ steps.build.outputs.digest }}"
