name: ci

on:
  push:
  pull_request:

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.14
        working-directory: benchmark
      - run: uv sync --locked
        working-directory: benchmark
      - name: Clone the vulnerable apps the white-box cells read
        run: |
          root="../local-targets"
          mkdir -p "$root"
          git clone --depth 1 https://github.com/juice-shop/juice-shop.git "$root/juice-shop"
          git clone --depth 1 https://github.com/erev0s/VAmPI.git "$root/VAmPI"
          git clone --depth 1 https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application.git "$root/dvga"
          git clone --depth 1 https://github.com/OWASP/crAPI.git "$root/crAPI"
          git clone --depth 1 https://github.com/ethz-spylab/agentdojo.git "$root/agentdojo"
      - name: Pull the apps the live cells hit
        run: |
          docker pull bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e
          docker pull erev0s/vampi@sha256:0a5a224b6e14ae7da6a6ea265178ff71286ff903aec74adee98f660bb0e4ca12
          docker pull dolevf/dvga@sha256:040aa33c199d99f3380c9ff9a1ee5d725e9abca7b189c63a35a2a73bda79c957
          docker compose -f ../local-targets/crAPI/deploy/docker/docker-compose.yml pull
      - name: Install Chrome for the Juice Shop page check
        run: |
          curl -fsSL -o /tmp/google-chrome-stable_current_amd64.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/google-chrome-stable_current_amd64.deb
      - run: uv run --project benchmark ruff check benchmark
      - run: uv run python -m pytest
        working-directory: benchmark

  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
        if: runner.os == 'Linux'
      - run: uv run mypy insidia
        if: runner.os == 'Linux'
      - run: uv run pytest
      - run: uv build --wheel
        if: runner.os == 'Linux'

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run links
      - run: npm run seo
      - run: node scripts/secrets.mjs dist

