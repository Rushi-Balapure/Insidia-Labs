name: Insidia scan
description: >
  Run an Insidia policy and upload SARIF to GitHub code scanning.
  version is required and has no default. This action installs the core
  project shipped with the action. version must match that
  core/pyproject.toml. insidia scan is invoked with --yes. --yes does not
  authorize a host: anything other than localhost, 127.0.0.1, or ::1 still
  needs authorized: true in insidia.yaml.

# GitHub applies permissions from the calling workflow. This block is the
# contract for that workflow: do not add actions: write, id-token: write,
# or contents: write.
permissions:
  contents: read
  security-events: write

inputs:
  version:
    description: >
      Insidia package version to install. Must match the core/pyproject.toml
      shipped with this action. Required. An empty value fails before any
      scan. Do not pass a branch name.
    required: true
  policy:
    description: Policy passed to insidia scan --policy. L1 is the policy that runs.
    required: false
    default: L1
  fail-on-inconclusive:
    description: >
      When true, scan exit code 2 fails the job. Exit code 1 always fails
      the job. Exit code 0 passes.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Require a pinned version
      shell: bash
      env:
        INSIDIA_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -z "${INSIDIA_VERSION}" ]; then
          printf '%s\n' "error: version is required and must be non-empty" >&2
          exit 1
        fi
        case "${INSIDIA_VERSION}" in
          *[!A-Za-z0-9._+-]*)
            printf '%s\n' "error: version must be a pin such as 0.1.0, not a floating ref" >&2
            exit 1
            ;;
        esac
        case "${INSIDIA_VERSION}" in
          *[0-9]*) ;;
          *)
            printf '%s\n' "error: version must be a pin such as 0.1.0, not a floating ref" >&2
            exit 1
            ;;
        esac

    - name: Set up uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

    - name: Install Insidia
      shell: bash
      env:
        INSIDIA_VERSION: ${{ inputs.version }}
        INSIDIA_CORE: ${{ github.action_path }}/../../core
      run: |
        set -euo pipefail
        if [ -z "${INSIDIA_VERSION}" ]; then
          printf '%s\n' "error: version is required and must be non-empty" >&2
          exit 1
        fi
        case "${INSIDIA_VERSION}" in
          *[!A-Za-z0-9._+-]*)
            printf '%s\n' "error: version must be a pin such as 0.1.0, not a floating ref" >&2
            exit 1
            ;;
        esac
        case "${INSIDIA_VERSION}" in
          *[0-9]*) ;;
          *)
            printf '%s\n' "error: version must be a pin such as 0.1.0, not a floating ref" >&2
            exit 1
            ;;
        esac
        if [ ! -f "$INSIDIA_CORE/pyproject.toml" ]; then
          printf '%s\n' "error: ${INSIDIA_CORE}/pyproject.toml is missing from the action checkout" >&2
          exit 1
        fi
        checkout_version="$(
          awk '
            $0 == "[project]" { section = 1; next }
            section && /^\[/ { section = 0 }
            section && /^version = / {
              value = $3
              gsub("\"", "", value)
              print value
              exit
            }
          ' "$INSIDIA_CORE/pyproject.toml"
        )"
        if [ "$checkout_version" != "$INSIDIA_VERSION" ]; then
          printf '%s\n' "error: action core version ${checkout_version} does not match ${INSIDIA_VERSION}" >&2
          exit 1
        fi
        uv python install 3.12
        uv tool install --python 3.12 --force "$INSIDIA_CORE"
        exit 0

    - name: Scan
      shell: bash
      env:
        INSIDIA_POLICY: ${{ inputs.policy }}
        INSIDIA_FAIL_ON_INCONCLUSIVE: ${{ inputs.fail-on-inconclusive }}
      run: |
        set -euo pipefail
        set +e
        insidia --json scan --policy "$INSIDIA_POLICY" --yes > insidia-scan.json
        code=$?
        set -e
        printf '%s\n' "insidia scan exit code: ${code}"
        if [ "$code" -eq 0 ]; then
          exit 0
        fi
        if [ "$code" -eq 1 ]; then
          exit 1
        fi
        if [ "$code" -eq 2 ]; then
          if [ "$INSIDIA_FAIL_ON_INCONCLUSIVE" = "true" ]; then
            exit 2
          fi
          if [ "$INSIDIA_FAIL_ON_INCONCLUSIVE" = "false" ]; then
            printf '%s\n' "scan was inconclusive (exit 2); fail-on-inconclusive is false" >&2
            exit 0
          fi
          printf '%s\n' "error: fail-on-inconclusive must be true or false" >&2
          exit 2
        fi
        exit "$code"

    - name: Collect scan reports
      if: always()
      id: reports
      shell: bash
      run: |
        set -euo pipefail
        dest="insidia-reports"
        rm -rf "$dest"
        mkdir -p "$dest"
        found=false
        sarif=false
        run_dir=""
        if [ -f insidia-scan.json ]; then
          run_dir="$(python3 - insidia-scan.json <<'PY'
        import json
        import os
        import re
        import sys
        from pathlib import Path

        pattern = re.compile(r"^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6}$")
        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        try:
            document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        except (OSError, UnicodeError, json.JSONDecodeError):
            raise SystemExit(0)
        if not isinstance(document, dict):
            raise SystemExit(0)
        raw = document.get("run_dir")
        if not isinstance(raw, str) or raw == "":
            raise SystemExit(0)
        try:
            candidate = Path(raw)
            given = candidate if candidate.is_absolute() else workspace / candidate
            if given.is_symlink():
                raise SystemExit(0)
            resolved = given.resolve(strict=True)
            if resolved.is_symlink() or not resolved.is_dir():
                raise SystemExit(0)
            relative = resolved.relative_to(workspace)
        except (OSError, ValueError):
            raise SystemExit(0)
        if relative.parts != (".insidia", "runs", resolved.name):
            raise SystemExit(0)
        if pattern.fullmatch(resolved.name) is None:
            raise SystemExit(0)
        text = str(resolved)
        if "\n" in text or "\x00" in text:
            raise SystemExit(0)
        print(text)
        PY
          )"
        fi
        if [ -n "$run_dir" ]; then
          copied=0
          for name in results.sarif report.html findings.json; do
            if [ -f "$run_dir/$name" ] && [ ! -L "$run_dir/$name" ]; then
              cp -- "$run_dir/$name" "$dest/$name"
              copied=$((copied + 1))
            fi
          done
          if [ -f "$dest/results.sarif" ]; then
            sarif=true
          fi
          if [ "$copied" -eq 3 ]; then
            found=true
          fi
        fi
        printf 'sarif=%s\n' "$sarif" >> "$GITHUB_OUTPUT"
        printf 'found=%s\n' "$found" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: always() && steps.reports.outputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: insidia-reports/results.sarif

    - name: Upload scan reports
      if: always() && steps.reports.outputs.found == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: insidia-reports
        path: insidia-reports/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14
