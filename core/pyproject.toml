[project]
name = "insidia"
version = "0.1.0"
description = "Insidia Labs CLI for scanning AI apps and web targets on your machine."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
insidia = "insidia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insidia"]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["insidia", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["insidia"]
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
